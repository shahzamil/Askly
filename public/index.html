<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Askly</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%233346C2'/><circle cx='16' cy='15' r='7' fill='none' stroke='white' stroke-width='3'/><path d='M20 20l5 5' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#F3F5FA; --panel:#FFFFFF; --side:#E9EDF6; --ink:#1A1F36; --muted:#646B85;
  --line:#D9DEEB; --accent:#3346C2; --accent-soft:#E3E7FB; --accent-ink:#FFFFFF;
  --user:#1F2A5C; --user-ink:#F1F3FF; --code:#EEF1F8; --danger:#B4232F; --ok:#2FA36B;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1426; --panel:#161C33; --side:#121830; --ink:#E6E9F5; --muted:#99A0BD;
    --line:#262E4D; --accent:#8C9BFF; --accent-soft:#232C55; --accent-ink:#0F1426;
    --user:#2B3770; --user-ink:#EEF0FF; --code:#1C2340; --danger:#FF7A85;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1426; --panel:#161C33; --side:#121830; --ink:#E6E9F5; --muted:#99A0BD;
  --line:#262E4D; --accent:#8C9BFF; --accent-soft:#232C55; --accent-ink:#0F1426;
  --user:#2B3770; --user-ink:#EEF0FF; --code:#1C2340; --danger:#FF7A85;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:280px 1fr;height:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* ---------- Sidebar ---------- */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 6px;font-weight:700;font-size:20px;letter-spacing:-.02em}
.logo{width:30px;height:30px;flex:none}
.side-top{padding:12px 14px 6px;display:grid;gap:10px}
.new{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:500}
.new:hover{border-color:var(--accent)}
.new kbd{margin-left:auto;font-family:var(--sans);font-size:12px;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:10px;background:var(--panel);border:1px solid transparent}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;border:0;outline:0;background:none;padding:9px 0;font-size:14.5px}
.search svg{width:16px;height:16px;color:var(--muted)}
.list{flex:1;overflow-y:auto;padding:0 10px 12px}
.group{font-size:13px;color:var(--muted);padding:14px 8px 6px}
.item{display:flex;align-items:center;gap:6px;border-radius:10px;padding:2px 2px 2px 10px}
.item.active,.item:hover{background:var(--panel)}
.item button.open{flex:1;text-align:left;border:0;background:none;padding:8px 0;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.item button.del{border:0;background:none;cursor:pointer;color:var(--muted);padding:6px 8px;opacity:0;border-radius:8px}
.item:hover button.del,.item.active button.del{opacity:1}
.item button.del:hover{color:var(--danger)}
.nolist{font-size:14px;color:var(--muted);padding:14px 8px}
.side-foot{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:4px;background:var(--side)}
.seg{flex:1;border:0;background:none;padding:7px 0;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.seg[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:500}

/* ---------- Main ---------- */
.main{display:flex;flex-direction:column;min-height:0;position:relative}
.bar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);min-height:56px}
.menu{display:none;border:0;background:none;cursor:pointer;padding:6px;border-radius:8px}
.bar h1{font-size:15px;font-weight:500;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,163,107,.5)}70%{box-shadow:0 0 0 7px rgba(47,163,107,0)}100%{box-shadow:0 0 0 0 rgba(47,163,107,0)}}

.scroll{flex:1;overflow-y:auto}
.thread{max-width:760px;margin:0 auto;padding:32px 24px 24px}

/* Welcome */
.empty{max-width:760px;margin:0 auto;padding:11vh 24px 24px}
.hello{font-family:var(--serif);font-weight:400;font-size:clamp(36px,5.4vw,58px);line-height:1.08;margin:0 0 6px;letter-spacing:-.015em;min-height:1.1em}
.sub{color:var(--muted);font-size:17px;margin:0 0 30px;min-height:1.5em}
.typed::after{content:"";display:inline-block;width:3px;height:.9em;margin-left:4px;vertical-align:-.08em;background:var(--accent);animation:blink 1s steps(2) infinite}
.starters-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.starters-head span{font-size:14px;color:var(--muted)}
.shuffle{border:0;background:none;color:var(--accent);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:8px;display:flex;gap:6px;align-items:center}
.shuffle:hover{background:var(--accent-soft)}
.shuffle svg{width:15px;height:15px;transition:transform .4s}
.shuffle.spin svg{transform:rotate(360deg)}
.starters{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.starter{text-align:left;padding:14px 16px;border:1px solid var(--line);background:var(--panel);
  border-radius:14px;cursor:pointer;font-size:15px;color:var(--ink);
  animation:rise .35s ease both;animation-delay:calc(var(--i) * 60ms);transition:border-color .15s,transform .15s}
.starter:hover{border-color:var(--accent);transform:translateY(-2px)}
.starter span{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Messages */
.msg{margin:0 0 28px;animation:rise .25s ease both}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.bubble{background:var(--user);color:var(--user-ink);padding:11px 16px;border-radius:18px 18px 4px 18px;
  max-width:min(82%,560px);white-space:pre-wrap;word-wrap:break-word}
.edit-row{display:flex;gap:4px;margin-top:6px;opacity:0;transition:opacity .15s}
.msg.user:hover .edit-row,.msg.user:focus-within .edit-row{opacity:1}
.editbox{width:min(100%,560px);background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:10px}
.editbox textarea{width:100%;border:0;outline:0;background:none;resize:vertical;min-height:70px}
.editbox .row{display:flex;justify-content:flex-end;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:9px;cursor:pointer;font-size:13.5px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.who{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;margin-bottom:6px}
.who .logo{width:22px;height:22px}
.body{font-family:var(--serif);font-size:18px;line-height:1.65;word-wrap:break-word}
.body p{margin:0 0 .8em}.body p:last-child{margin-bottom:0}
.body ul,.body ol{padding-left:1.3em;margin:0 0 .8em}.body li{margin:.2em 0}
.body h1,.body h2,.body h3{font-family:var(--sans);font-weight:600;line-height:1.3;margin:1.2em 0 .5em}
.body h1{font-size:1.25em}.body h2{font-size:1.12em}.body h3{font-size:1em}
.body a{color:var(--accent)}
.body code{font-family:var(--mono);font-size:.82em;background:var(--code);padding:.12em .36em;border-radius:5px}
.body pre{position:relative;background:var(--code);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto;margin:0 0 1em}
.body pre code{background:none;padding:0;font-size:13.5px;line-height:1.55}
.copy{position:absolute;top:8px;right:8px;font-family:var(--sans);font-size:12px;border:1px solid var(--line);
  background:var(--panel);border-radius:8px;padding:3px 9px;cursor:pointer;color:var(--muted)}
.copy:hover{color:var(--ink)}
.body table{border-collapse:collapse;display:block;overflow-x:auto;font-family:var(--sans);font-size:14.5px;margin:0 0 1em}
.body th,.body td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.body blockquote{margin:0 0 1em;padding-left:14px;border-left:3px solid var(--line);color:var(--muted)}
.tools{display:flex;gap:2px;margin-top:8px;align-items:center}
.tools button,.edit-row button{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 8px;border-radius:8px;cursor:pointer}
.tools button:hover,.edit-row button:hover{background:var(--side);color:var(--ink)}
.tools .meta{font-size:12.5px;color:var(--muted);margin-left:auto}
.err{font-family:var(--sans);font-size:14px;color:var(--danger)}

/* thinking dots + caret */
.thinking{display:inline-flex;gap:5px;padding:8px 0}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:bounce 1.1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.caret>:last-child::after,.caret:empty::after{content:"";display:inline-block;width:.5em;height:1em;vertical-align:-.12em;margin-left:2px;
  background:var(--accent);border-radius:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* jump button */
.jump{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);width:38px;height:38px;border-radius:50%;
  border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;
  box-shadow:0 6px 18px -8px rgba(26,31,54,.35);animation:rise .2s ease both}
.jump svg{width:18px;height:18px}

/* Composer */
.composer{padding:0 24px 18px}
.box{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:10px 10px 10px 18px;display:flex;align-items:flex-end;gap:10px;
  box-shadow:0 6px 24px -12px rgba(26,31,54,.25);transition:border-color .15s,box-shadow .15s}
.box:focus-within{border-color:var(--accent);box-shadow:0 8px 30px -12px rgba(51,70,194,.35)}
.box textarea{flex:1;border:0;outline:0;background:none;resize:none;max-height:220px;padding:8px 0;line-height:1.5}
.send{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;cursor:pointer;transition:transform .12s,opacity .15s}
.send:active{transform:scale(.92)}
.send:disabled{opacity:.35;cursor:default}
.send svg{width:18px;height:18px}
.hint{max-width:760px;margin:8px auto 0;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:50;animation:rise .2s ease both}

.scrim{display:none}
@media (max-width: 820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:86%;max-width:310px;z-index:20;transform:translateX(-100%);
    transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px)}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(10,14,30,.42);z-index:10}
  .menu{display:block}
  .thread,.empty{padding-left:16px;padding-right:16px}
  .composer{padding:0 12px 12px}
  .body{font-size:17px}
  .hint .keys{display:none}
  .edit-row{opacity:1}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="9" fill="var(--accent)"/>
    <circle cx="15" cy="14.5" r="6.5" fill="none" stroke="var(--accent-ink)" stroke-width="3"/>
    <path d="M19.8 19.3l5 5" stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="app" id="app">
  <aside class="side" aria-label="Chats">
    <div class="brand"><svg class="logo"><use href="#mark"/></svg>Askly</div>
    <div class="side-top">
      <button class="new" id="newChat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New chat <kbd id="kbd">Ctrl K</kbd>
      </button>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search chats" aria-label="Search chats">
      </label>
    </div>
    <div class="list" id="list"></div>
    <div class="side-foot" role="group" aria-label="Theme">
      <button class="seg" data-theme="system">System</button>
      <button class="seg" data-theme="light">Light</button>
      <button class="seg" data-theme="dark">Dark</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="bar">
      <button class="menu" id="menu" aria-label="Open chats">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1 id="title">New chat</h1>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">Checking server</span></div>
    </div>

    <div class="scroll" id="scroll">
      <div class="empty" id="empty">
        <h2 class="hello"><span id="hello"></span></h2>
        <p class="sub" id="sub"></p>
        <div class="starters-head">
          <span>Try one of these</span>
          <button class="shuffle" id="shuffle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
            New ideas
          </button>
        </div>
        <div class="starters" id="starters"></div>
      </div>
      <div class="thread" id="thread" hidden></div>
    </div>

    <button class="jump" id="jump" aria-label="Scroll to latest" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    </button>

    <div class="composer">
      <div class="box">
        <textarea id="input" rows="1" aria-label="Message"></textarea>
        <button class="send" id="send" aria-label="Send" disabled>
          <svg id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="hint"><span class="keys">Enter to send, Shift + Enter for a new line, Esc to stop</span><span id="count"></span></div>
    </div>
  </main>
</div>

<script>
const API_URL = "/api/chat";          // your backend endpoint
const STORE_KEY = "askly-chats-v1";
const THEME_KEY = "askly-theme";

const $ = (id) => document.getElementById(id);
const els = { app:$("app"), list:$("list"), thread:$("thread"), empty:$("empty"), scroll:$("scroll"),
  input:$("input"), send:$("send"), title:$("title"), dot:$("dot"), status:$("statusText"),
  search:$("search"), starters:$("starters"), jump:$("jump"), count:$("count") };

let chats = load();
let currentId = null;
let controller = null;
let demoMode = false;
let query = "";

/* ---------- prompt ideas (shuffled) ---------- */
const IDEAS = [
  ["Write a cold email","to a startup founder","Write a short cold email to a startup founder about a partnership."],
  ["Explain a concept","vector databases, simply","Explain how vector databases work in simple words."],
  ["Plan an interview","for a senior backend engineer","Give me 10 interview questions for a senior backend engineer."],
  ["Get honest feedback","on an idea or plan","Review this idea and tell me the weak points honestly: "],
  ["Summarize text","paste anything long","Summarize this in 5 short bullet points: "],
  ["Fix my code","find the bug","Find the bug in this code and explain the fix: "],
  ["Make a plan","for a 7-day product launch","Make a simple 7-day plan for launching a new app."],
  ["Write a LinkedIn post","about a team win","Write a short LinkedIn post about my team shipping a big feature."],
  ["Compare options","pros and cons","Compare these two options with pros and cons: "],
  ["Learn something","in 5 minutes","Teach me the basics of SQL joins in 5 minutes."],
  ["Brainstorm names","for a product","Give me 10 short, brandable names for a "],
  ["Reply politely","to a tough email","Help me reply politely but firmly to this email: "]
];
const PLACEHOLDERS = ["Ask anything", "Paste text to summarize", "Describe a bug", "Plan your week", "Draft an email"];

function renderStarters(){
  const pick = [...IDEAS].sort(() => Math.random() - .5).slice(0, 4);
  els.starters.innerHTML = "";
  pick.forEach(([t, s, p], i) => {
    const b = document.createElement("button");
    b.className = "starter"; b.style.setProperty("--i", i);
    b.innerHTML = `${esc(t)}<span>${esc(s)}</span>`;
    b.onclick = () => (p.endsWith(": ") || p.endsWith("a ")) ? (els.input.value = p, autosize(), els.input.focus()) : send(p);
    els.starters.appendChild(b);
  });
}
$("shuffle").onclick = (e) => { const b = e.currentTarget; b.classList.add("spin"); setTimeout(()=>b.classList.remove("spin"),400); renderStarters(); };

/* ---------- welcome typing ---------- */
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function greeting(){
  const h = new Date().getHours();
  return h < 5 ? "Working late?" : h < 12 ? "Good morning." : h < 17 ? "Good afternoon." : "Good evening.";
}
let typeTimer;
function typeWelcome(){
  clearTimeout(typeTimer);
  const el = $("hello"), sub = $("sub"), text = greeting();
  sub.textContent = "";
  if (reduced){ el.textContent = text; sub.textContent = "What do you want to work on?"; return; }
  el.textContent = ""; el.classList.add("typed"); let i = 0;
  const step = () => {
    el.textContent = text.slice(0, ++i);
    if (i < text.length) typeTimer = setTimeout(step, 45);
    else { el.classList.remove("typed"); typeTimer = setTimeout(() => sub.textContent = "What do you want to work on?", 180); }
  };
  step();
}
let phIndex = 0;
setInterval(() => { if (!els.input.value && document.activeElement !== els.input){ phIndex = (phIndex+1) % PLACEHOLDERS.length; els.input.placeholder = PLACEHOLDERS[phIndex]; } }, 3000);
els.input.placeholder = PLACEHOLDERS[0];

/* ---------- storage ---------- */
function load(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { return []; } }
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(chats)); } catch {} }
const current = () => chats.find(c => c.id === currentId);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));

/* ---------- theme ---------- */
function setTheme(t){
  if (t === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  document.querySelectorAll(".seg").forEach(b => b.setAttribute("aria-pressed", b.dataset.theme === t));
  try { localStorage.setItem(THEME_KEY, t); } catch {}
}
document.querySelectorAll(".seg").forEach(b => b.onclick = () => setTheme(b.dataset.theme));
setTheme((() => { try { return localStorage.getItem(THEME_KEY) || "system"; } catch { return "system"; } })());

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function md(text){
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text, { breaks:true, gfm:true }));
  return "<p>" + esc(text).replace(/\n/g,"<br>") + "</p>";
}
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1600);
}
function copyText(text){ navigator.clipboard?.writeText(text).then(() => toast("Copied"), () => toast("Copy failed")); }
function addCopyButtons(root){
  root.querySelectorAll("pre").forEach(pre => {
    if (pre.querySelector(".copy")) return;
    const code = pre.querySelector("code");
    const b = document.createElement("button"); b.className = "copy"; b.textContent = "Copy";
    b.onclick = () => { copyText((code || pre).innerText); b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1400); };
    pre.appendChild(b);
  });
}
function dayGroup(ts){
  const d = new Date(ts), now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if (ts >= start) return "Today";
  if (ts >= start - 864e5) return "Yesterday";
  if (ts >= start - 7 * 864e5) return "Last 7 days";
  return "Older";
}
const wordCount = (s) => (s.trim().match(/\S+/g) || []).length;

/* ---------- sidebar ---------- */
function renderList(){
  els.list.innerHTML = "";
  const q = query.toLowerCase();
  const items = [...chats].sort((a,b) => b.updated - a.updated)
    .filter(c => !q || c.title.toLowerCase().includes(q) || c.messages.some(m => m.content.toLowerCase().includes(q)));
  if (!items.length){ els.list.innerHTML = `<div class="nolist">${q ? "No chats match your search." : "Your chats will show here."}</div>`; return; }
  let last = "";
  items.forEach(c => {
    const g = dayGroup(c.updated);
    if (g !== last){ const h = document.createElement("div"); h.className = "group"; h.textContent = g; els.list.appendChild(h); last = g; }
    const row = document.createElement("div");
    row.className = "item" + (c.id === currentId ? " active" : "");
    row.innerHTML = `<button class="open">${esc(c.title)}</button><button class="del" aria-label="Delete chat">✕</button>`;
    row.querySelector(".open").onclick = () => { openChat(c.id); closeSide(); };
    row.querySelector(".del").onclick = () => deleteChat(c.id);
    els.list.appendChild(row);
  });
}
els.search.addEventListener("input", e => { query = e.target.value; renderList(); });

/* ---------- thread ---------- */
function renderThread(){
  const c = current(), has = c && c.messages.length;
  els.empty.hidden = !!has; els.thread.hidden = !has;
  els.title.textContent = c ? c.title : "New chat";
  document.title = c ? `${c.title} · Askly` : "Askly";
  els.thread.innerHTML = "";
  if (has) c.messages.forEach((m, i) => els.thread.appendChild(msgEl(m, i, c)));
  else { typeWelcome(); renderStarters(); }
  scrollDown(true);
}
function msgEl(m, i, c){
  const wrap = document.createElement("div");
  wrap.className = "msg " + (m.role === "user" ? "user" : "bot");
  if (m.role === "user"){
    const b = document.createElement("div"); b.className = "bubble"; b.textContent = m.content; wrap.appendChild(b);
    const row = document.createElement("div"); row.className = "edit-row";
    const cp = document.createElement("button"); cp.textContent = "Copy"; cp.onclick = () => copyText(m.content);
    const ed = document.createElement("button"); ed.textContent = "Edit"; ed.onclick = () => startEdit(wrap, i);
    row.append(cp, ed); wrap.appendChild(row);
  } else {
    wrap.appendChild(whoEl());
    const body = document.createElement("div"); body.className = "body";
    body.innerHTML = md(m.content); addCopyButtons(body); wrap.appendChild(body);
    wrap.appendChild(toolsEl(m, i === c.messages.length - 1));
  }
  return wrap;
}
function whoEl(){ const w = document.createElement("div"); w.className = "who"; w.innerHTML = '<svg class="logo"><use href="#mark"/></svg>Askly'; return w; }
function toolsEl(m, isLast){
  const t = document.createElement("div"); t.className = "tools";
  const copy = document.createElement("button"); copy.textContent = "Copy"; copy.onclick = () => copyText(m.content);
  t.appendChild(copy);
  if (isLast){ const re = document.createElement("button"); re.textContent = "Retry"; re.onclick = regenerate; t.appendChild(re); }
  if (m.ms){ const meta = document.createElement("span"); meta.className = "meta"; meta.textContent = `${wordCount(m.content)} words in ${(m.ms/1000).toFixed(1)}s`; t.appendChild(meta); }
  return t;
}
function startEdit(wrap, i){
  if (controller) return;
  const c = current(), old = c.messages[i].content;
  wrap.innerHTML = `<div class="editbox"><textarea aria-label="Edit message"></textarea>
    <div class="row"><button class="btn" data-a="cancel">Cancel</button><button class="btn primary" data-a="save">Send</button></div></div>`;
  const ta = wrap.querySelector("textarea"); ta.value = old; ta.focus();
  wrap.querySelector('[data-a="cancel"]').onclick = renderThread;
  wrap.querySelector('[data-a="save"]').onclick = async () => {
    const v = ta.value.trim(); if (!v) return;
    c.messages = c.messages.slice(0, i); c.messages.push({ role:"user", content:v }); c.updated = Date.now(); save();
    renderThread(); renderList(); await stream(c);
  };
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); wrap.querySelector('[data-a="save"]').click(); } });
}

/* ---------- scrolling ---------- */
function nearBottom(){ const s = els.scroll; return s.scrollHeight - s.scrollTop - s.clientHeight < 140; }
function scrollDown(force){ if (force || nearBottom()) els.scroll.scrollTop = els.scroll.scrollHeight; }
els.scroll.addEventListener("scroll", () => { els.jump.hidden = nearBottom() || els.thread.hidden; });
els.jump.onclick = () => els.scroll.scrollTo({ top: els.scroll.scrollHeight, behavior: reduced ? "auto" : "smooth" });

/* ---------- chats ---------- */
function newChat(){ currentId = null; renderThread(); renderList(); els.input.focus(); }
function openChat(id){ currentId = id; renderThread(); renderList(); }
function deleteChat(id){
  chats = chats.filter(c => c.id !== id); save();
  if (currentId === id) currentId = null;
  renderThread(); renderList(); toast("Chat deleted");
}

/* ---------- sending ---------- */
async function send(text){
  text = text.trim();
  if (!text || controller) return;
  let c = current();
  if (!c){ c = { id: uid(), title: text.replace(/\s+/g," ").slice(0, 46), messages: [], updated: Date.now() }; chats.push(c); currentId = c.id; }
  c.messages.push({ role:"user", content:text }); c.updated = Date.now(); save();
  els.input.value = ""; autosize(); renderThread(); renderList();
  await stream(c);
}
async function regenerate(){
  const c = current(); if (!c || controller) return;
  if (c.messages.at(-1)?.role === "assistant") c.messages.pop();
  renderThread(); await stream(c);
}

async function stream(c){
  const wrap = document.createElement("div"); wrap.className = "msg bot";
  wrap.appendChild(whoEl());
  const body = document.createElement("div"); body.className = "body";
  body.innerHTML = '<span class="thinking" aria-label="Thinking"><i></i><i></i><i></i></span>';
  wrap.appendChild(body); els.thread.appendChild(wrap); scrollDown(true);

  controller = new AbortController(); setBusy(true);
  els.status.textContent = "Writing";
  const t0 = performance.now();
  let out = "", pending = false, failed = false;
  const paint = () => { pending = false; body.classList.add("caret"); body.innerHTML = md(out); scrollDown(); };

  try {
    const reader = demoMode ? demoReader(c.messages.at(-1).content) : await apiReader(c.messages);
    const dec = new TextDecoder();
    while (true){
      const { value, done } = await reader.read();
      if (done) break;
      out += typeof value === "string" ? value : dec.decode(value, { stream:true });
      if (!pending){ pending = true; requestAnimationFrame(paint); }   // one repaint per frame keeps it smooth
    }
  } catch (e){
    if (e.name !== "AbortError"){ failed = true;
      body.innerHTML = md(out) + `<p class="err">${esc(e.message || "Request failed.")} Check that the server is running, then press Retry.</p>`; }
  }

  body.classList.remove("caret");
  if (!failed) body.innerHTML = md(out || "_Stopped._");
  addCopyButtons(body);
  if (out){ const m = { role:"assistant", content:out, ms: Math.round(performance.now() - t0) };
    c.messages.push(m); c.updated = Date.now(); save(); wrap.appendChild(toolsEl(m, true)); }
  else if (failed) wrap.appendChild(toolsEl({ content:"" }, true));
  controller = null; setBusy(false); renderList(); setStatus();
}

async function apiReader(messages){
  const res = await fetch(API_URL, {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ messages: messages.map(({role, content}) => ({ role, content })) }),
    signal: controller.signal
  });
  if (!res.ok || !res.body){ let detail = ""; try { detail = (await res.text()).trim().slice(0, 300); } catch {} throw new Error(`Server replied ${res.status}${detail ? ": " + detail : "."}`); }
  return res.body.getReader();
}

// Demo mode: only used when no backend is found, so you can see the UI working.
function demoReader(q){
  const text = `This is **demo mode**. No backend was found at \`${API_URL}\`.\n\nTo connect Askly to Claude:\n\n1. Add your API key to \`.env\`\n2. Run \`npm start\`\n3. Refresh this page\n\nYour message was:\n\n> ${q.slice(0,200)}`;
  const parts = text.match(/.{1,3}/gs); let i = 0; const sig = controller.signal;
  return { read: () => new Promise((ok, no) => {
    if (sig.aborted) return no(new DOMException("aborted","AbortError"));
    setTimeout(() => ok(i < parts.length ? { value: parts[i++], done:false } : { done:true }), i === 0 ? 600 : 16);
  })};
}

function setBusy(b){
  els.send.disabled = !b && !els.input.value.trim();
  els.send.setAttribute("aria-label", b ? "Stop" : "Send");
  $("sendIcon").innerHTML = b ? '<rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/>'
                              : '<path d="M12 19V5M5 12l7-7 7 7"/>';
}
function setStatus(){
  els.dot.classList.toggle("on", !demoMode);
  els.status.textContent = demoMode ? "Demo mode" : "Connected";
}

/* ---------- input ---------- */
function autosize(){
  els.input.style.height = "auto"; els.input.style.height = Math.min(els.input.scrollHeight, 220) + "px";
  if (!controller) els.send.disabled = !els.input.value.trim();
  const n = els.input.value.length; els.count.textContent = n > 200 ? `${n.toLocaleString()} characters` : "";
}
els.input.addEventListener("input", autosize);
els.input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(els.input.value); }
});
els.send.onclick = () => controller ? controller.abort() : send(els.input.value);
$("newChat").onclick = () => { newChat(); closeSide(); };
$("menu").onclick = () => els.app.classList.add("open");
$("scrim").onclick = closeSide;
function closeSide(){ els.app.classList.remove("open"); }
if (/Mac|iPhone|iPad/.test(navigator.platform)) $("kbd").textContent = "⌘ K";
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); newChat(); }
  if (e.key === "Escape"){ if (controller) controller.abort(); closeSide(); }
  if (e.key === "/" && document.activeElement === document.body){ e.preventDefault(); els.input.focus(); }
});

/* ---------- server check ---------- */
(async () => {
  try {
    const r = await fetch(API_URL, { method:"POST", headers:{ "Content-Type":"application/json" }, body:"{}" });
    demoMode = r.status === 404 || r.status === 405 || r.status === 503;
  } catch { demoMode = true; }
  setStatus();
})();

renderList(); renderThread(); els.input.focus();
</script>
</body>
